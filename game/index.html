<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen Harvest</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #070818;
    height: 100%;
    overflow: hidden;
    font-family: "Trebuchet MS", Verdana, Geneva, sans-serif;
  }
  #wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  canvas {
    display: block;
    width: min(100vw, 160vh);
    height: auto;
    max-height: 100vh;
    background: #0a0c26;
    cursor: crosshair;
    border-radius: 6px;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="600" aria-label="Lumen Harvest game canvas"></canvas>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
